name: Windows desktop alpha

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/build-desktop.ps1'
      - 'scripts/make_desktop_icons.py'
      - 'scripts/smoke_desktop.py'
      - 'scripts/smoke_portable.ps1'
      - '.github/workflows/desktop-windows.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/build-desktop.ps1'
      - 'scripts/make_desktop_icons.py'
      - 'scripts/smoke_desktop.py'
      - 'scripts/smoke_portable.ps1'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    name: Windows x64 desktop alpha bundle
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install desktop Python dependencies
        run: python -m pip install -r backend/requirements-desktop.txt pyinstaller pillow

      - name: Build backend sidecar, smoke-test it and assemble the unsigned portable folder
        shell: pwsh
        run: ./scripts/build-desktop.ps1 -SkipInstall

      - name: Portable smoke test (real GUI app + sidecar, data location, shutdown)
        shell: pwsh
        run: ./scripts/smoke_portable.ps1 -PortableDir desktop/portable/AstraTube-Portable

      - name: Rust unit tests (isolated YouTube player protocol)
        run: cargo test --release --manifest-path desktop/src-tauri/Cargo.toml

      - name: Upload private CI portable artifact (not a public release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          # 下載後的 ZIP 解壓縮即是 AstraTube-Portable 資料夾內容
          name: AstraTube-Windows-x64-portable-unsigned
          path: desktop/portable/AstraTube-Portable/
          if-no-files-found: error
          retention-days: 7
